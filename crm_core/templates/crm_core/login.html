{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - CRM Imobiliário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'crm_core/style.css' %}?v=3">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm bg-white" style="width: 100%; max-width: 420px; border-top: 5px solid #be123c;">
        <div class="card-header card-header-corporate text-center py-4" style="background-color: #0618B5; color: #ffffff;">
            <h4 class="mb-0 fw-bold">🏢 CRM Imobiliário</h4>
            <small class="text-white-50">Acesso Exclusivo para Consultores</small>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
                <div class="alert badge-danger-soft p-2 text-center mb-3 rounded">
                    Utilizador ou palavra-passe incorretos.
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #0618B5;">Utilizador</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #0618B5;">Palavra-passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-outline-corporate w-100 py-2">
                    🔒 Entrar no Sistema
                </button>
            </form>
        </div>
    </div>
</body>
</html>
